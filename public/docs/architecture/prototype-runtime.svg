<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 672" role="img" aria-label="One Worker serves the pages, AI routes and demo data; data lives in D1" font-size="13"><title>One Worker serves the pages, AI routes and demo data; data lives in D1</title><defs><marker id="pr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F877E"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1C1917">One Worker serves the pages, AI routes and demo data; data lives in D1</text><g fill="none" stroke="#8F877E" stroke-width="1.25"><path d="M380 232V256" marker-end="url(#pr-arrow)"></path><path d="M192 388H216" marker-end="url(#pr-arrow)"></path><path d="M368 388H392" marker-end="url(#pr-arrow)"></path><path d="M544 388H568" marker-end="url(#pr-arrow)"></path><path d="M644 432V472" marker-end="url(#pr-arrow)"></path><path d="M468 432V452H196V472" stroke-dasharray="5 4" marker-end="url(#pr-arrow)"></path></g><text x="388" y="248" font-size="11.5" fill="#57534E">HTTPS</text><g><rect x="24" y="56" width="712" height="176" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="40" y="76" font-size="12" font-weight="600" fill="#57534E">Browser</text><rect x="40" y="88" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="148" y="112" text-anchor="middle" font-weight="600" fill="#1C1917">Role views</text><text x="148" y="128" text-anchor="middle" font-size="11.5" fill="#57534E">React, six personas</text><rect x="272" y="88" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="380" y="112" text-anchor="middle" font-weight="600" fill="#1C1917">Onboarding</text><text x="380" y="128" text-anchor="middle" font-size="11.5" fill="#57534E">file or paste import</text><rect x="504" y="88" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="612" y="112" text-anchor="middle" font-weight="600" fill="#1C1917">Invoice upload</text><text x="612" y="128" text-anchor="middle" font-size="11.5" fill="#57534E">photo or PDF, 4 MB max</text><rect x="40" y="160" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="140" y="184" text-anchor="middle" font-weight="600" fill="#1C1917">Demo store</text><text x="140" y="200" text-anchor="middle" font-size="11.5" fill="#57534E">shows state, posts actions</text><rect x="256" y="160" width="144" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="328" y="184" text-anchor="middle" font-weight="600" fill="#1C1917">Ledger</text><text x="328" y="200" text-anchor="middle" font-size="11.5" fill="#57534E">balance, statement</text><rect x="416" y="160" width="144" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="488" y="184" text-anchor="middle" font-weight="600" fill="#1C1917">Ratings</text><text x="488" y="200" text-anchor="middle" font-size="11.5" fill="#57534E">one per job</text><rect x="576" y="160" width="144" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="648" y="184" text-anchor="middle" font-weight="600" fill="#1C1917">Importer</text><text x="648" y="200" text-anchor="middle" font-size="11.5" fill="#57534E">CSV parse, row checks</text></g><g><rect x="24" y="256" width="712" height="192" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="40" y="276" font-size="12" font-weight="600" fill="#57534E">Cloudflare Worker · propniti.ai (Next.js 16 built with vinext)</text><rect x="40" y="288" width="680" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="380" y="312" text-anchor="middle" fill="#1C1917">Pages and server rendering · marketing, auth, onboarding, role and detail pages</text><rect x="40" y="344" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="116" y="368" text-anchor="middle" font-weight="600" fill="#1C1917">API routes</text><text x="116" y="384" text-anchor="middle" font-size="11.5" fill="#57534E">6 AI routes</text><text x="116" y="400" text-anchor="middle" font-size="11.5" fill="#57534E">1 GET + 16 POST</text><text x="116" y="416" text-anchor="middle" font-size="11.5" fill="#57534E">demo data routes</text><rect x="216" y="344" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="292" y="376" text-anchor="middle" font-weight="600" fill="#1C1917">Guards</text><text x="292" y="392" text-anchor="middle" font-size="11.5" fill="#57534E">rate limit, zod</text><text x="292" y="408" text-anchor="middle" font-size="11.5" fill="#57534E">4 MB, file sniff</text><rect x="392" y="344" width="152" height="88" rx="8" fill="#8A6A45" fill-opacity="0.12" stroke="#8A6A45" stroke-width="2"></rect><text x="468" y="376" text-anchor="middle" font-weight="600" fill="#1C1917">LLM module</text><text x="468" y="392" text-anchor="middle" font-size="11.5" fill="#1C1917">provider choice</text><text x="468" y="408" text-anchor="middle" font-size="11.5" fill="#1C1917">policy, completeness</text><rect x="568" y="344" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="644" y="376" text-anchor="middle" font-weight="600" fill="#1C1917">Platform port</text><text x="644" y="392" text-anchor="middle" font-size="11.5" fill="#57534E">Workers adapter</text><text x="644" y="408" text-anchor="middle" font-size="11.5" fill="#57534E">SQLite on Node</text></g><g><rect x="24" y="472" width="344" height="104" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="40" y="492" font-size="12" font-weight="600" fill="#57534E">Model APIs (only if a key is set)</text><rect x="40" y="504" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="114" y="528" text-anchor="middle" font-weight="600" fill="#1C1917">Anthropic</text><text x="114" y="544" text-anchor="middle" font-size="11.5" fill="#57534E">claude-opus-5</text><rect x="204" y="504" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="278" y="528" text-anchor="middle" font-weight="600" fill="#1C1917">OpenAI</text><text x="278" y="544" text-anchor="middle" font-size="11.5" fill="#57534E">gpt-5.5</text></g><g><rect x="392" y="472" width="344" height="176" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="408" y="492" font-size="12" font-weight="600" fill="#57534E">Cloudflare bindings</text><rect x="408" y="504" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="482" y="528" text-anchor="middle" font-weight="600" fill="#1C1917">Workers AI</text><text x="482" y="544" text-anchor="middle" font-size="11.5" fill="#57534E">Llama 4 Scout</text><rect x="572" y="504" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="646" y="528" text-anchor="middle" font-weight="600" fill="#1C1917">Rate limiter</text><text x="646" y="544" text-anchor="middle" font-size="11.5" fill="#57534E">20 AI, 60 writes/min</text><rect x="408" y="576" width="312" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="564" y="600" text-anchor="middle" font-weight="600" fill="#1C1917">D1 database</text><text x="564" y="616" text-anchor="middle" font-size="11.5" fill="#57534E">propniti, one workspace per visitor</text></g></svg>
