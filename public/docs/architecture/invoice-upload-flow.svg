<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 616" role="img" aria-label="An upload is checked before the model sees it, and discarded after" font-size="13"><title>An upload is checked before the model sees it, and discarded after</title><defs><marker id="up-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F877E"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1C1917">An upload is checked before the model sees it, and discarded after</text><g fill="none" stroke="#8F877E" stroke-width="1.25"><path d="M212 112V136" marker-end="url(#up-arrow)"></path><path d="M212 192V216" marker-end="url(#up-arrow)"></path><path d="M212 272V296" marker-end="url(#up-arrow)"></path><path d="M212 352V376" marker-end="url(#up-arrow)"></path><path d="M212 432V456" marker-end="url(#up-arrow)"></path><path d="M212 512V536" marker-end="url(#up-arrow)"></path><path d="M352 164H408" marker-end="url(#up-arrow)"></path><path d="M352 244H408" marker-end="url(#up-arrow)"></path><path d="M352 324H408" marker-end="url(#up-arrow)"></path><path d="M352 404H408" marker-end="url(#up-arrow)"></path></g><text x="220" y="208" font-size="11.5" fill="#57534E">yes</text><text x="220" y="288" font-size="11.5" fill="#57534E">yes</text><text x="220" y="448" font-size="11.5" fill="#57534E">yes</text><text x="380" y="156" text-anchor="middle" font-size="11.5" fill="#57534E">no</text><text x="380" y="236" text-anchor="middle" font-size="11.5" fill="#57534E">no</text><text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#57534E">fails</text><text x="380" y="396" text-anchor="middle" font-size="11.5" fill="#57534E">no</text><g><rect x="72" y="56" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="80" text-anchor="middle" font-weight="600" fill="#1C1917">Upload invoice</text><text x="212" y="96" text-anchor="middle" font-size="11.5" fill="#57534E">photo or PDF from the browser</text></g><g><rect x="72" y="136" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="160" text-anchor="middle" font-weight="600" fill="#1C1917">Under the rate limit?</text><text x="212" y="176" text-anchor="middle" font-size="11.5" fill="#57534E">20 requests per minute per IP</text></g><g><rect x="72" y="216" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="240" text-anchor="middle" font-weight="600" fill="#1C1917">File allowed?</text><text x="212" y="256" text-anchor="middle" font-size="11.5" fill="#57534E">≤ 4 MB · type by file signature</text></g><g><rect x="72" y="296" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="320" text-anchor="middle" font-weight="600" fill="#1C1917">Read with the model</text><text x="212" y="336" text-anchor="middle" font-size="11.5" fill="#57534E">vision model; PDFs become text first</text></g><g><rect x="72" y="376" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="400" text-anchor="middle" font-weight="600" fill="#1C1917">Output matches the schema?</text><text x="212" y="416" text-anchor="middle" font-size="11.5" fill="#57534E">zod-validated JSON</text></g><g><rect x="72" y="456" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="212" y="480" text-anchor="middle" font-weight="600" fill="#1C1917">Consistency checks</text><text x="212" y="496" text-anchor="middle" font-size="11.5" fill="#57534E">lines add up · vendor · USD · legible</text></g><g><rect x="72" y="536" width="280" height="56" rx="8" fill="#8A6A45" fill-opacity="0.12" stroke="#8A6A45" stroke-width="2"></rect><text x="212" y="560" text-anchor="middle" font-weight="600" fill="#1C1917">Fill the vendor&#x27;s invoice</text><text x="212" y="576" text-anchor="middle" font-size="11.5" fill="#1C1917">file discarded; PO check runs next</text></g><g><rect x="408" y="136" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="548" y="160" text-anchor="middle" font-weight="600" fill="#1C1917">429 Too many requests</text><text x="548" y="176" text-anchor="middle" font-size="11.5" fill="#57534E">try again in a minute</text></g><g><rect x="408" y="216" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="548" y="240" text-anchor="middle" font-weight="600" fill="#1C1917">413 or 415, refused</text><text x="548" y="256" text-anchor="middle" font-size="11.5" fill="#57534E">nothing is read</text></g><g><rect x="408" y="296" width="280" height="136" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="548" y="352" text-anchor="middle" font-weight="600" fill="#1C1917">Fallback note</text><text x="548" y="368" text-anchor="middle" font-size="11.5" fill="#57534E">no fields filled in;</text><text x="548" y="384" text-anchor="middle" font-size="11.5" fill="#57534E">user told the AI call failed</text></g></svg>
