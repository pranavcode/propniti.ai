<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" width="1000" height="622" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How an agent run turns into a change</title><desc id="d">Six triggers start a run in the orchestrator. The agent collects candidates with scoped read tools; a model, when configured, may check and word them but must match a rules candidate. Each proposal carries risk, amount, confidence and a source label. Routing applies autonomy, approval-policy limits and always-a-person rules. A proposal either applies on its own or waits for a person allowed by the decide rule. Either way the registered action re-checks the record and runs once, writing effects, audit and activity.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A939E"/></marker></defs><rect width="1000" height="622" fill="#fff"/><text x="20" y="28" font-size="12" font-weight="600" fill="#5B6470" text-anchor="start">Triggers</text><rect x="20" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Schedule</text><text x="32" y="79" font-size="12" fill="#5B6470">Cron, every 15 min</text><path d="M95,92 L95,110 L500,110 L500,126" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="182" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="194" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Run on visit</text><text x="194" y="79" font-size="12" fill="#5B6470">no sweep for 17 min</text><path d="M257,92 L257,110" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="344" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="356" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Events outbox</text><text x="356" y="79" font-size="12" fill="#5B6470">e.g. charge.overdue</text><path d="M419,92 L419,110" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="506" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="518" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Run now</text><text x="518" y="79" font-size="12" fill="#5B6470">Agents page</text><path d="M581,92 L581,110" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="668" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="680" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Do mode</text><text x="680" y="79" font-size="12" fill="#5B6470">assistant chat</text><path d="M743,92 L743,110" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="830" y="40" width="150" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="842" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Improve with AI</text><text x="842" y="79" font-size="12" fill="#5B6470">plan on chosen records</text><path d="M905,92 L905,110 L500,110 L500,126" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="126" width="400" height="58" rx="8" fill="#E6F2F1" stroke="#0F6B6B" stroke-width="1.2"/><text x="312" y="147" font-size="13.5" font-weight="600" fill="#0F6B6B">Orchestrator  src/ai/orchestrator.ts</text><text x="312" y="165" font-size="12" fill="#5B6470">agent_runs + agent_steps; deadline, step limit, 50¢ model budget</text><path d="M500,184 L500,204" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="204" width="960" height="92" rx="8" fill="#F6F7F8" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="224" font-size="12" font-weight="600" fill="#5B6470" letter-spacing="0.02em">One of 8 agents</text><rect x="36" y="232" width="290" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="48" y="253" font-size="13.5" font-weight="600" fill="#1B1F24">1 · Collect</text><text x="48" y="271" font-size="12" fill="#5B6470">rules find candidates with scoped read tools</text><rect x="352" y="232" width="290" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="364" y="253" font-size="13.5" font-weight="600" fill="#1B1F24">2 · Model (optional)</text><text x="364" y="271" font-size="12" fill="#5B6470">checks and words; must match a candidate</text><rect x="668" y="232" width="296" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="680" y="253" font-size="13.5" font-weight="600" fill="#1B1F24">3 · Rules</text><text x="680" y="271" font-size="12" fill="#5B6470">no model or it failed; mandatory items always</text><path d="M326,258 L352,258" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M642,258 L668,258" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M500,296 L500,316" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="316" width="500" height="58" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="262" y="337" font-size="13.5" font-weight="600" fill="#1B1F24">Proposal  (ai_proposals)</text><text x="262" y="355" font-size="12" fill="#5B6470">risk, amount, confidence, reasons, source label, record snapshot</text><path d="M500,374 L500,394" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="394" width="700" height="58" rx="8" fill="#E6F2F1" stroke="#0F6B6B" stroke-width="1.2"/><text x="162" y="415" font-size="13.5" font-weight="600" fill="#0F6B6B">Routing</text><text x="162" y="433" font-size="12" fill="#5B6470">autonomy (Approve first / Auto within policy) · approval-policy limits · legal, safety, high risk: always a person</text><path d="M320,452 L320,476" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M680,452 L680,476" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="130" y="476" width="380" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="142" y="497" font-size="13.5" font-weight="600" fill="#1B1F24">Applies on its own</text><text x="142" y="515" font-size="12" fill="#5B6470">Low risk, within the limit, Auto within policy</text><rect x="530" y="476" width="340" height="52" rx="8" fill="#FFF8E6" stroke="#E8C66A" stroke-width="1.2"/><text x="542" y="497" font-size="13.5" font-weight="600" fill="#9A6700">Waits for a person</text><text x="542" y="515" font-size="12" fill="#5B6470">decide rule src/ai/decide.ts; owner over limit</text><path d="M320,528 L320,548" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M700,528 L700,538 L600,538 L600,548" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="130" y="548" width="740" height="58" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="142" y="569" font-size="13.5" font-weight="600" fill="#1B1F24">Registered named action</text><text x="142" y="587" font-size="12" fill="#5B6470">re-checks scope, record snapshot and precondition; runs once → effects, audit, activity</text></svg>