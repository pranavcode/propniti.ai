roke="#8F877E" stroke-width="1.25"></rect><text x="148" y="724" text-anchor="middle" font-weight="600" fill="#1C1917">Audit log</text><text x="148" y="740" text-anchor="middle" font-size="11.5" fill="#57534E">append-only, every decision</text></g><g><rect x="288" y="380" width="248" height="400" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="304" y="400" font-size="12" font-weight="600" fill="#57534E">Agent layer</text><rect x="304" y="412" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="412" y="436" text-anchor="middle" font-weight="600" fill="#1C1917">Triggers</text><text x="412" y="452" text-anchor="middle" font-size="11.5" fill="#57534E">15-min schedule, events</text><rect x="304" y="484" width="216" height="56" rx="8" fill="#8A6A45" fill-opacity="0.12" stroke="#8A6A45" stroke-width="2"></rect><text x="412" y="508" text-anchor="middle" font-weight="600" fill="#1C1917">Orchestrator agent</text><text x="412" y="524" text-anchor="middle" font-size="11.5" fill="#1C1917">plans and runs actions</text><rect x="304" y="556" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="412" y="580" text-anchor="middle" font-weight="600" fill="#1C1917">Tools</text><text x="412" y="596" text-anchor="middle" font-size="11.5" fill="#57534E">typed calls to service APIs</text><rect x="304" y="628" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="412" y="652" text-anchor="middle" font-weight="600" fill="#1C1917">Policy engine</text><text x="412" y="668" text-anchor="middle" font-size="11.5" fill="#57534E">auto-run, ask a person, or stop</text><rect x="304" y="700" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="412" y="724" text-anchor="middle" font-weight="600" fill="#1C1917">Model port</text><text x="412" y="7