ve · on-site roles</text></g><g><rect x="24" y="128" width="512" height="36" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="280" y="150" text-anchor="middle" font-weight="600" fill="#1C1917">Ingress gateway · auth · rate limits</text></g><g><rect x="24" y="184" width="512" height="172" rx="10" fill="#F3EEE5" stroke="#8F877E" stroke-width="1"></rect><text x="40" y="204" font-size="12" font-weight="600" fill="#57534E">Domain services · Kubernetes (EKS, GKE or AKS)</text><rect x="40" y="216" width="149" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="114.5" y="240" text-anchor="middle" font-weight="600" fill="#1C1917">Users + KYC</text><text x="114.5" y="256" text-anchor="middle" font-size="11.5" fill="#57534E">profiles, ID checks</text><rect x="205" y="216" width="149" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="279.5" y="240" text-anchor="middle" font-weight="600" fill="#1C1917">Property</text><text x="279.5" y="256" text-anchor="middle" font-size="11.5" fill="#57534E">units, leases</text><rect x="370" y="216" width="149" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="444.5" y="240" text-anchor="middle" font-weight="600" fill="#1C1917">Payments</text><text x="444.5" y="256" text-anchor="middle" font-size="11.5" fill="#57534E">ledger, payouts</text><rect x="40" y="284" width="149" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="114.5" y="308" text-anchor="middle" font-weight="600" fill="#1C1917">Notifications</text><text x="114.5" y="324" text-anchor="middle" font-size="11.5" fill="#57534E">SMS, voice, email</text><rect x="205" y="284" width="149" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="279.5" y="308" text-anchor="middle" font-weig