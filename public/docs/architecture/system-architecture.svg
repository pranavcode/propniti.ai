<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Propniti v2 system architecture</title><desc id="d">Browsers reach one Cloudflare Worker at propniti.ai. The Worker serves pages and APIs with vinext, checks scope and permissions, and runs the AI runtime. It reads and writes one D1 database holding a shared read-only base and a private overlay per visitor. Models are reached through one provider layer. A Cron Trigger every 15 minutes starts the agent sweep.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A939E"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect x="20" y="60" width="220" height="330" rx="8" fill="#F6F7F8" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="80" font-size="12" font-weight="600" fill="#5B6470" letter-spacing="0.02em">Browser</text><rect x="36" y="92" width="188" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="48" y="113" font-size="13.5" font-weight="600" fill="#1B1F24">Staff app</text><text x="48" y="131" font-size="12" fill="#5B6470">/app · 9 staff roles</text><rect x="36" y="154" width="188" height="70" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="48" y="175" font-size="13.5" font-weight="600" fill="#1B1F24">Portals</text><text x="48" y="193" font-size="12" fill="#5B6470">/portal/owner, resident,</text><text x="48" y="209" font-size="12" fill="#5B6470">vendor, applicant</text><rect x="36" y="234" width="188" height="52" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="48" y="255" font-size="13.5" font-weight="600" fill="#1B1F24">Public site</text><text x="48" y="273" font-size="12" fill="#5B6470">/listings, /apply · no sign-in</text><rect x="36" y="296" width="188" height="70" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="48" y="317" font-size="13.5" font-weight="600" fill="#1B1F24">Marketing and docs</text><text x="48" y="335" font-size="12" fill="#5B6470">/, /pricing, /security, /docs</text><rect x="300" y="20" width="400" height="520" rx="8" fill="#F6F7F8" stroke="#D5D9DE" stroke-width="1.2"/><text x="312" y="40" font-size="12" font-weight="600" fill="#5B6470" letter-spacing="0.02em">Cloudflare Worker · propniti.ai</text><rect x="316" y="52" width="368" height="58" rx="8" fill="#E6F2F1" stroke="#0F6B6B" stroke-width="1.2"/><text x="328" y="73" font-size="13.5" font-weight="600" fill="#0F6B6B">Cron Trigger  */15 * * * *</text><text x="328" y="91" font-size="12" fill="#5B6470">scheduled() in src/worker-entry.ts → AI sweep</text><rect x="316" y="128" width="368" height="58" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="328" y="149" font-size="13.5" font-weight="600" fill="#1B1F24">vinext (Next.js App Router)</text><text x="328" y="167" font-size="12" fill="#5B6470">pages and API routes; same-origin check on writes</text><rect x="316" y="204" width="368" height="58" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="328" y="225" font-size="13.5" font-weight="600" fill="#1B1F24">Scope and permissions</text><text x="328" y="243" font-size="12" fill="#5B6470">role × module matrix; scope filtered in SQL</text><rect x="316" y="280" width="368" height="90" rx="8" fill="#E6F2F1" stroke="#0F6B6B" stroke-width="1.2"/><text x="328" y="301" font-size="13.5" font-weight="600" fill="#0F6B6B">AI runtime</text><text x="328" y="319" font-size="12" fill="#5B6470">orchestrator: runs and steps, time, step and cost limits</text><text x="328" y="335" font-size="12" fill="#5B6470">8 agents, assistant, summaries, Explain</text><text x="328" y="351" font-size="12" fill="#5B6470">proposals → approval routing → named actions</text><rect x="316" y="388" width="368" height="58" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="328" y="409" font-size="13.5" font-weight="600" fill="#1B1F24">Provider layer  src/ai/providers</text><text x="328" y="427" font-size="12" fill="#5B6470">one model per request; rules when none answers</text><rect x="316" y="464" width="176" height="60" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="328" y="485" font-size="13.5" font-weight="600" fill="#1B1F24">Rate limiters</text><text x="328" y="503" font-size="12" fill="#5B6470">AI 20 / min / IP</text><text x="328" y="519" font-size="12" fill="#5B6470">writes 60 / min / IP</text><rect x="508" y="464" width="176" height="60" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="520" y="485" font-size="13.5" font-weight="600" fill="#1B1F24">ASSETS</text><text x="520" y="503" font-size="12" fill="#5B6470">images, fonts, docs files</text><rect x="760" y="60" width="220" height="220" rx="8" fill="#F6F7F8" stroke="#D5D9DE" stroke-width="1.2"/><text x="772" y="80" font-size="12" font-weight="600" fill="#5B6470" letter-spacing="0.02em">D1 · propniti-v2</text><rect x="776" y="92" width="188" height="80" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="788" y="113" font-size="13.5" font-weight="600" fill="#1B1F24">Shared base</text><text x="788" y="131" font-size="12" fill="#5B6470">workspace &#x27;base&#x27;</text><text x="788" y="147" font-size="12" fill="#5B6470">30 properties, read-only</text><text x="788" y="163" font-size="12" fill="#5B6470">at runtime</text><rect x="776" y="182" width="188" height="84" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="788" y="203" font-size="13.5" font-weight="600" fill="#1B1F24">Visitor overlay</text><text x="788" y="221" font-size="12" fill="#5B6470">own rows per pn_ws cookie;</text><text x="788" y="237" font-size="12" fill="#5B6470">replaces base rows by id;</text><text x="788" y="253" font-size="12" fill="#5B6470">wiped at midnight Pacific</text><rect x="760" y="320" width="220" height="200" rx="8" fill="#F6F7F8" stroke="#D5D9DE" stroke-width="1.2"/><text x="772" y="340" font-size="12" font-weight="600" fill="#5B6470" letter-spacing="0.02em">AI providers</text><rect x="776" y="352" width="188" height="50" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="788" y="373" font-size="13.5" font-weight="600" fill="#1B1F24">Workers AI (default)</text><text x="788" y="391" font-size="12" fill="#5B6470">Llama 4 Scout</text><rect x="776" y="410" width="188" height="50" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="788" y="431" font-size="13.5" font-weight="600" fill="#1B1F24">Anthropic or OpenAI</text><text x="788" y="449" font-size="12" fill="#5B6470">when an API key is set</text><rect x="776" y="468" width="188" height="42" rx="8" fill="#FFF8E6" stroke="#E8C66A" stroke-width="1.2"/><text x="788" y="489" font-size="13.5" font-weight="600" fill="#9A6700">Rules fallback</text><path d="M240,225 L316,158" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><text x="252" y="182" font-size="11.5" fill="#5B6470">HTTPS</text><path d="M500,110 L500,128" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M500,186 L500,204" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M500,262 L500,280" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M500,370 L500,388" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M684,233 L760,233" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><text x="708" y="226" font-size="11.5" fill="#5B6470">SQL</text><path d="M684,417 L760,420" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M316,81 L308,81 L308,325 L316,325" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><text x="250" y="300" font-size="11.5" font-weight="400" fill="#5B6470" text-anchor="start">sweep</text></svg>