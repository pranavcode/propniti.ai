<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Who sees and does what</title><desc id="d">A persona signs in and gets a role. The role&#x27;s permission per module (none, read, write or approve) and the persona&#x27;s scope (platform, org, region, a set of properties, or self for portals) decide what is visible; queries filter by scope in SQL. Writes re-check scope inside the batch. Agent proposals use the decide rule: write access for low-risk items with no amount, approve access for money, legal or safety, and life-safety items only for the regional manager or principal.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A939E"/></marker></defs><rect width="1000" height="420" fill="#fff"/><rect x="20" y="40" width="176" height="66" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Persona</text><text x="32" y="79" font-size="12" fill="#5B6470">sign-in or card</text><text x="32" y="95" font-size="12" fill="#5B6470">pn_as cookie</text><path d="M196,73 L220,73" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="40" width="176" height="66" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="232" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Role</text><text x="232" y="79" font-size="12" fill="#5B6470">9 staff roles</text><text x="232" y="95" font-size="12" fill="#5B6470">4 portal roles</text><path d="M396,73 L420,73" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="420" y="40" width="176" height="66" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="432" y="61" font-size="13.5" font-weight="600" fill="#1B1F24">Module permission</text><text x="432" y="79" font-size="12" fill="#5B6470">none · read ·</text><text x="432" y="95" font-size="12" fill="#5B6470">write · approve</text><path d="M596,73 L620,73" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="40" width="176" height="66" rx="8" fill="#E6F2F1" stroke="#0F6B6B" stroke-width="1.2"/><text x="632" y="61" font-size="13.5" font-weight="600" fill="#0F6B6B">Scope</text><text x="632" y="79" font-size="12" fill="#5B6470">platform · org · region</text><text x="632" y="95" font-size="12" fill="#5B6470">properties · self</text><path d="M708,106 L708,130 L250,130 L250,150" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><path d="M708,130 L750,130 L750,150" fill="none" stroke="#8A939E" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="150" width="460" height="120" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="171" font-size="13.5" font-weight="600" fill="#1B1F24">What you see</text><text x="32" y="189" font-size="12" fill="#5B6470">lists, metrics, charts, exports, search and the assistant</text><text x="32" y="205" font-size="12" fill="#5B6470">are filtered to your scope in SQL</text><text x="32" y="221" font-size="12" fill="#5B6470"></text><text x="32" y="237" font-size="12" fill="#5B6470">an out-of-scope record looks the same as a missing one</text><rect x="520" y="150" width="460" height="120" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="532" y="171" font-size="13.5" font-weight="600" fill="#1B1F24">What you can do</text><text x="532" y="189" font-size="12" fill="#5B6470">writes: entity rights, scope re-checked inside the batch</text><text x="532" y="205" font-size="12" fill="#5B6470">agent proposals: the decide rule (src/ai/decide.ts)</text><text x="532" y="221" font-size="12" fill="#5B6470">  low risk, no amount → write access</text><text x="532" y="237" font-size="12" fill="#5B6470">  money, legal or safety → approve access</text><rect x="520" y="290" width="460" height="50" rx="8" fill="#FFF8E6" stroke="#E8C66A" stroke-width="1.2"/><text x="532" y="311" font-size="13.5" font-weight="600" fill="#9A6700">Life-safety items</text><text x="532" y="329" font-size="12" fill="#5B6470">only the property&#x27;s regional manager or the principal</text><rect x="20" y="290" width="460" height="110" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="32" y="311" font-size="13.5" font-weight="600" fill="#1B1F24">Portals are self-scoped</text><text x="32" y="329" font-size="12" fill="#5B6470">owner: own entities and their properties</text><text x="32" y="345" font-size="12" fill="#5B6470">resident: own lease and household</text><text x="32" y="361" font-size="12" fill="#5B6470">vendor: own jobs, invoices and certificates</text><text x="32" y="377" font-size="12" fill="#5B6470">applicant: own application</text><rect x="520" y="352" width="460" height="48" rx="8" fill="#fff" stroke="#D5D9DE" stroke-width="1.2"/><text x="532" y="373" font-size="13.5" font-weight="600" fill="#1B1F24">Over the owner&#x27;s limit</text><text x="532" y="391" font-size="12" fill="#5B6470">the owner decides in the portal, or a principal</text></svg>