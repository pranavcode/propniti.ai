ll-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="344" y="424" text-anchor="middle" font-weight="600" fill="#1C1917">Pending</text><text x="344" y="440" text-anchor="middle" font-size="11.5" fill="#57534E">ACH, 1–2 business days</text></g><g><rect x="504" y="400" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="584" y="424" text-anchor="middle" font-weight="600" fill="#1C1917">Cleared</text><text x="584" y="440" text-anchor="middle" font-size="11.5" fill="#57534E">ledger posted</text></g><g><rect x="264" y="496" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="344" y="520" text-anchor="middle" font-weight="600" fill="#1C1917">Returned</text><text x="344" y="536" text-anchor="middle" font-size="11.5" fill="#57534E">bank rejects transfer</text></g></svg>
