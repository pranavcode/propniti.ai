<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 376" role="img" aria-label="Imported data is checked row by row before it reaches the portfolio" font-size="13"><title>Imported data is checked row by row before it reaches the portfolio</title><defs><marker id="im-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F877E"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1C1917">Imported data is checked row by row before it reaches the portfolio</text><g fill="none" stroke="#8F877E" stroke-width="1.25"><path d="M164 108H196" marker-end="url(#im-arrow)"></path><path d="M368 108H400" marker-end="url(#im-arrow)"></path><path d="M572 108H588V140H604" marker-end="url(#im-arrow)"></path><path d="M164 212H196" marker-end="url(#im-arrow)"></path><path d="M368 212H588V180H604" marker-end="url(#im-arrow)"></path><path d="M670 196V264H486V280" marker-end="url(#im-arrow)"></path><path d="M572 316H604" marker-end="url(#im-arrow)"></path></g><g><rect x="24" y="72" width="140" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="94" y="104" text-anchor="middle" font-weight="600" fill="#1C1917">Rent-roll file</text><text x="94" y="120" text-anchor="middle" font-size="11.5" fill="#57534E">CSV or TSV, 2 MB max</text></g><g><rect x="196" y="72" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="282" y="96" text-anchor="middle" font-weight="600" fill="#1C1917">Parse in browser</text><text x="282" y="112" text-anchor="middle" font-size="11.5" fill="#57534E">RFC 4180 parser</text><text x="282" y="128" text-anchor="middle" font-size="11.5" fill="#57534E">file never uploaded</text></g><g><rect x="400" y="72" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="486" y="96" text-anchor="middle" font-weight="600" fill="#1C1917">Match columns</text><text x="486" y="112" text-anchor="middle" font-size="11.5" fill="#57534E">/api/ai/import-map</text><text x="486" y="128" text-anchor="middle" font-size="11.5" fill="#57534E">headers + 5 sample rows</text></g><g><rect x="24" y="176" width="140" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="94" y="208" text-anchor="middle" font-weight="600" fill="#1C1917">Pasted text</text><text x="94" y="224" text-anchor="middle" font-size="11.5" fill="#57534E">email or notes</text></g><g><rect x="196" y="176" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="282" y="200" text-anchor="middle" font-weight="600" fill="#1C1917">Read rows with AI</text><text x="282" y="216" text-anchor="middle" font-size="11.5" fill="#57534E">/api/ai/import-parse</text><text x="282" y="232" text-anchor="middle" font-size="11.5" fill="#57534E">table fallback</text></g><g><rect x="604" y="124" width="132" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="670" y="148" text-anchor="middle" font-weight="600" fill="#1C1917">Check rows</text><text x="670" y="164" text-anchor="middle" font-size="11.5" fill="#57534E">fields, rent, dates,</text><text x="670" y="180" text-anchor="middle" font-size="11.5" fill="#57534E">duplicates, emails</text></g><g><rect x="400" y="280" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8F877E" stroke-width="1.25"></rect><text x="486" y="304" text-anchor="middle" font-weight="600" fill="#1C1917">Review and fix</text><text x="486" y="320" text-anchor="middle" font-size="11.5" fill="#57534E">change any match</text><text x="486" y="336" text-anchor="middle" font-size="11.5" fill="#57534E">errors shown per row</text></g><g><rect x="604" y="280" width="132" height="72" rx="8" fill="#8A6A45" fill-opacity="0.12" stroke="#8A6A45" stroke-width="2"></rect><text x="670" y="304" text-anchor="middle" font-weight="600" fill="#1C1917">Import</text><text x="670" y="320" text-anchor="middle" font-size="11.5" fill="#1C1917">valid rows only</text><text x="670" y="336" text-anchor="middle" font-size="11.5" fill="#1C1917">checked on server</text></g></svg>
