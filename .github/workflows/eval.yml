name: AI eval

# Manual only: the eval calls the live model, so it costs money, is rate limited and can be flaky.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to evaluate
        default: https://propniti.ai
        required: true
      min_pass:
        description: Minimum pass rate (0 to 1)
        default: "0.8"
        required: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          BASE_URL: ${{ inputs.base_url }}
          MIN_PASS: ${{ inputs.min_pass }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
